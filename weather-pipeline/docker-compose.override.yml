services:
  dwh:
    image: postgres:16
    container_name: dwh
    environment:
      POSTGRES_USER: dbt
      POSTGRES_PASSWORD: dbt
      POSTGRES_DB: dbt_demo
    ports:
      - "5433:5432"
    volumes:
      - dwh_data:/var/lib/postgresql/data
    networks:
      - airflow

volumes:
  dwh_data:
