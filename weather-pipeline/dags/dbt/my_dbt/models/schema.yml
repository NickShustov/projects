version: 2
models:
  - name: customer_totals
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: stg_weather
    description: "Очищенные ежедневные данные о погоде"
    columns:
      - name: weather_date
        data_tests: [unique, not_null]
      - name: temperature_c
        data_tests: [not_null]
      - name: wind_speed_kmh
        data_tests: [not_null]
      - name: pressure_hpa
        data_tests: [not_null]

  - name: weather_weekly
    description: "Погода по неделям"
    columns:
      - name: week_start
        data_tests: [unique, not_null]